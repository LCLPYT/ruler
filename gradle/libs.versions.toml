[versions]
minecraft = "26.2"
fabric-api = "0.152.2+26.2"
fabric-loader = "0.19.3"
fabric-loom = "1.17-SNAPSHOT"
gradle-build-tools = "1.7.0"
java = "25"
kibu-hook-api = "1.5.0"
kibu-access-lib = "0.18.0+26.2"
kibu-hooks = "0.64.1+26.2"
kibu-fabric-hooks = "0.5.1+26.2"
kibu-translation-api = "0.27.0+26.2"
kibu-behaviour-api = "0.1.0+26.2"
fabric-permissions-api = "0.7.0"
